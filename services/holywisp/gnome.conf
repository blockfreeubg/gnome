# holywisp.conf for GNOME: HolyWisp behind the GNOME gateway (gnome-server, Rust/Axum) on one host.
#
# The reverse proxy (Caddy, Cloudflare, ...) terminates TLS; the gateway accepts the /wisp/ upgrades of
# wss://<proxy origin>/wisp/ (plain HTTP behind the reverse proxy), checks Origin and the Wisp ticket,
# drops every client-supplied forwarding header, writes exactly one X-Forwarded-For: <client ip>,
# forwards the HTTP Upgrade to 127.0.0.1:6001 and splices the socket (docs/ARCHITECTURE.md §4.4).
#
# Validated against holywisp 0.1.0 at e0a0f15 (docs/research/holywisp.md §6.3; re-run by
# services/holywisp/tests/smoke.sh). Keys not listed keep their compiled-in defaults.
# Syntax: `key = value`, `#` starts a comment when preceded by whitespace, an unknown key is fatal
# (exit 2). Every key is also a command-line flag (`--port 7000`), and flags override this file.
# Several files may be given (`--config a --config b`): later files override scalar keys, and list
# keys (block-port, trusted-proxy, trusted-header) accumulate. The VPN egress instances use that
# (vpn-egress.conf.example).
#
# 32-bit builds (armhf, i386): do NOT add ws-write-high-water or stream-queue-max. In 0.1.0 their
# upper bound (1L << 31) overflows a 32-bit long, so every value is rejected and the file fails to
# load (exit 2). Their defaults (8 MiB, 16 MiB) are what GNOME wants anyway. GNOME's own builds are
# amd64 and arm64, where both keys work; keep this file portable regardless.
# Raspberry Pi 4 (4 cores, 1-8 GB): see the "Pi 4:" notes below (workers, connection caps).

# ------------------------------------------------------------------------------------- listening
host = 127.0.0.1                 # loopback only. HolyWisp has no Origin check and no authentication;
                                 # anyone who can reach this port gets a relay. Never "" (all
                                 # interfaces). Use a literal, not "localhost" (may bind ::1 only).
                                 # In a container that is not in the gateway's network namespace,
                                 # override with --host 0.0.0.0 and set trusted-proxy to the gateway.
port = 6001                      # the gateway's GNOME_WISP_UPSTREAM. One process per port: a second
                                 # holywisp started by the same UID on this port silently shares it
                                 # (SO_REUSEPORT), so supervisors must wait for the old one to exit.
workers = 0                      # epoll loops; 0 = one per online CPU of the host (cgroup CPU quotas
                                 # are not seen: set it explicitly under `docker run --cpus`).
                                 # Pi 4: workers = 4.
listen-backlog = 1024
log-level = warn                 # privacy: info logs every refused destination with the client IP,
                                 # debug logs every stream's host:port. Use info to debug policy.

# ---------------------------------------------------------------------- what clients may reach
# The egress policy is applied to every address a name resolves to, after DNS, so a hostname that
# points at a private address is refused like the literal (verified with nip.io and /etc/hosts).
allow-tcp = on
allow-udp = off                  # the browser transports (libcurl, epoxy) only open TCP streams; UDP
                                 # would only add an amplification and scanning surface
allow-direct-ip = on             # public IP literals work (sites and game servers addressed by IP).
                                 # The class checks below still apply to literals, and wildcard DNS
                                 # (1.2.3.4.nip.io) would reach the same addresses anyway. Set off
                                 # for the stricter posture (every literal refused, even 1.1.1.1).
allow-private = off              # 10/8, 172.16/12, 192.168/16, 100.64/10 (CGNAT), fc00::/7: the LAN,
                                 # Docker networks, VPN-internal addresses
allow-loopback = off             # 127/8, ::1: this host's own services (gnome-server, its admin
                                 # listener on 127.0.0.1:9091, HolyWisp itself)
allow-link-local = off           # 169.254/16 incl. 169.254.169.254 cloud metadata, fe80::/10
# Always refused whatever the flags: 0/8 and ::, multicast, broadcast, reserved/documentation
# ranges. IPv4-mapped IPv6 (::ffff:a.b.c.d) gets the class of a.b.c.d; NAT64 (64:ff9b::/96),
# IPv4-compatible and 6to4 addresses are refused even when the wrapped IPv4 is public, so an
# IPv6-only host behind DNS64 cannot reach IPv4-only sites: run HolyWisp on a dual-stack host.

# Ports every browser refuses for http(s) and ws(s): the Fetch Standard "bad port" list
# (https://fetch.spec.whatwg.org/#bad-port, whatwg/fetch e9460d1; port 0 is refused by the protocol
# anyway). Blocking them costs no web compatibility and stops SMTP/SSH/IRC/SIP/... abuse through the
# relay. Matched on the port the client asked for, before DNS.
block-port = 1
block-port = 7
block-port = 9
block-port = 11
block-port = 13
block-port = 15
block-port = 17
block-port = 19-23
block-port = 25
block-port = 37
block-port = 42-43
block-port = 53
block-port = 69
block-port = 77
block-port = 79
block-port = 87
block-port = 95
block-port = 101-104
block-port = 109-111
block-port = 113
block-port = 115
block-port = 117
block-port = 119
block-port = 123
block-port = 135
block-port = 137
block-port = 139
block-port = 143
block-port = 161
block-port = 179
block-port = 389
block-port = 427
block-port = 465
block-port = 512-515
block-port = 526
block-port = 530-532
block-port = 540
block-port = 548
block-port = 554
block-port = 556
block-port = 563
block-port = 587
block-port = 601
block-port = 636
block-port = 989-990
block-port = 993
block-port = 995
block-port = 1719-1720
block-port = 1723
block-port = 2049
block-port = 3659
block-port = 4045
block-port = 4190
block-port = 5060-5061
block-port = 6000
block-port = 6566
block-port = 6665-6669
block-port = 6679
block-port = 6697
block-port = 10080
# No allow-host/block-host: they match the name as the client typed it, before DNS, so they are no
# security boundary (a literal or another name reaches the same address).

# -------------------------------------------------------------------------------------- protocol
enable-v2 = on                   # libcurl/epoxy speak Wisp v1, wisp-js and epoxy {wisp_v2:true} speak
                                 # v2; both work on the same port
enable-twisp = off               # Twisp = a remote shell running a CLIENT-chosen command on a PTY.
                                 # Must stay off.
motd =
password-required = off          # no browser transport can send Wisp v2 credentials; the gateway
                                 # authenticates users (Wisp tickets, ARCHITECTURE §4.6)
# No password-user lines: they would only matter for Twisp or password-required.

# ----------------------------------------------------------------------------- who the client is
# HolyWisp applies its per-IP limits (and logs) to the "policy IP". Behind the gateway every socket
# peer is 127.0.0.1, so the real client IP must come from a header the gateway controls.
parse-real-ip = on
trusted-proxy = 127.0.0.1/32     # only the local gateway may set the client IP
trusted-headers-reset = on       # clear the compiled-in list (CF-Connecting-IP, X-Forwarded-For):
                                 # CF-Connecting-IP is checked first and would let a client spoof
                                 # its IP through any gateway that forwards it
trusted-header = X-Forwarded-For # the one header the gateway writes. HolyWisp reads the FIRST
                                 # occurrence, truncated to 511 chars, so the gateway must remove
                                 # client copies and write exactly one bare IP (no port, no list).

# ----------------------------------------------------------------------------- per-client limits
connections-limit-per-ip = 200   # new WebSockets per policy IP per window (HTTP 429 beyond)
connection-window-s = 10
bandwidth-limit-kbps = 0         # broken in 0.1.0 (downloads are not limited, uploads ~9x the cap):
                                 # byte quotas are enforced by the gateway's splice loop instead
max-streams-per-conn = 512       # bounds one connection's memory; browsers stay far below it
                                 # (libcurl-transport pools 50). Pi 4: 256.

# ------------------------------------------------------------------- flood protection (defaults)
flood-protection = on            # master switch for every limit in this section
max-connects-per-source-per-second = 500
max-connects-per-dest-per-second = 100     # server-wide per destination ip:port (shared by all
max-connects-per-dest-per-minute = 3000    # users: raise both for large deployments behind a CDN)
max-in-flight-syns = 4096
max-concurrent-connections = 10000         # WebSockets server-wide (HTTP 503 beyond). Pi 4: 2000.
syn-signature = on               # closes a WebSocket that scans (mostly failing connects)
ws-close-after-violations = 64
log-blocked-dials = off

# ------------------------------------------------------------------------------------ reputation
# The IP reputation scorer refuses a client IP (HTTP 403 at upgrade) after about six lookups of
# names that resolve to private addresses and decays 1 point per hour, so ordinary users get locked
# out for ~10 hours. GNOME authenticates users at the gateway, so it is off.
reputation = off
reputation-store =               # memory only if it is ever turned on: the store is a persistent log
                                 # of client IPs, rewritten every 30 s (SD-card wear on a Pi)

# ----------------------------------------------------------------------------- where streams go
# proxy = socks5://<ip>:1080     # one upstream proxy for the whole process; see vpn-egress.conf.example
proxy-udp = refuse
# dns-server unset: the system resolver (/etc/hosts + /etc/resolv.conf for the static musl build).
# The built-in client (any dns-server line) has no EDNS0, no TCP fallback and predictable query IDs.
dns-ttl-s = 120
dns-negative-ttl-s = 10
dns-order = ipv4first
dns-timeout-ms = 3000            # built-in client only
resolver-threads = 8             # getaddrinfo blocks; more threads = less head-of-line blocking

# ------------------------------------------------------------------------------- tuning and HTTP
# max-message-size (1 MiB + 5), ws-write-high-water and stream-queue-max keep their defaults: a
# smaller max-message-size closes whole WebSockets with 1009 when a transport sends a big frame,
# and the other two break 32-bit builds (header).
connect-timeout-ms = 15000
handshake-timeout-ms = 10000     # TCP accept -> completed upgrade (v1) or client INFO (v2)
tcp-nodelay = on
tcp-quickack = on
serve-webclient = off            # no demo page on GET /
non-ws-response = ""             # plain HTTP gets 426. GET /health and GET /stats still answer on
                                 # this port without authentication: never route them publicly.
