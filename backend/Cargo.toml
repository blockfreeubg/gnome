[package]
name = "gnome-server"
description = "GNOME web proxy platform server: static files, API, Wisp gateway, background jobs"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gnome_server"
path = "src/lib.rs"

[[bin]]
name = "gnome-server"
path = "src/main.rs"

[dependencies]
gnome-net = { path = "../crates/net" }
gnome-catalog = { path = "../crates/catalog" }
argon2.workspace = true
axum.workspace = true
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
clap.workspace = true
flate2.workspace = true
getrandom.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
percent-encoding.workspace = true
rpassword.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Wave C: the server-side VPN exit check speaks Wisp over a WebSocket and TLS through it (backend/src/vpn/exit.rs).
futures-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
webpki-roots.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Paused-clock tests (timeouts) run instantly.
tokio = { workspace = true, features = ["test-util"] }
