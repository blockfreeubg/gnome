<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="gnome-app-origins" content="%GNOME_APP_ORIGINS%" />
    <meta name="referrer" content="no-referrer" />
    <title>GNOME engine host</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101310;
        color: #c8cdc8;
        font: 14px system-ui, sans-serif;
      }
      #tabs {
        position: absolute;
        inset: 0;
      }
      #tabs > iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #tabs > iframe[hidden] {
        display: none;
      }
      #standalone {
        padding: 2em;
      }
    </style>
    <!-- Engine builds, unmodified, in ENGINE_HOST_SCRIPTS order (scramjet.js before controller.api.js). -->
    <script src="/vendor/scramjet/scramjet.js"></script>
    <script src="/vendor/scramjet-controller/controller.api.js"></script>
    <script src="/vendor/bare-mux/index.js"></script>
    <script src="/vendor/ultraviolet/uv.bundle.js"></script>
    <script src="/engine/uv.config.js"></script>
    <script type="module" src="/src/engine-host/main.ts"></script>
  </head>
  <body>
    <div id="tabs"></div>
  </body>
</html>
