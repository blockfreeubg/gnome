reviewed = "2026-11-23: read the pinned commit (WAVE-C D5): no localStorage/sessionStorage clearing, indexedDB.deleteDatabase, caches.delete or service-worker register/unregister; no innerHTML/document.write/eval fed from location, the hash, document.referrer or postMessage; no external loads of code, styles or fonts; storage: localStorage (best score and game state)"

