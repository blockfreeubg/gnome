# GNOME curated open-source games (source = "oss").
#
# Only the repositories verified in docs/research/games-sources.md §8.2 are listed. Re-verified on 2026-11-10:
# `commit` is the repository HEAD on that date (`git ls-remote`), `license_file` / `copyright` were read from that
# commit on raw.githubusercontent.com, and `entry` was fetched at that commit together with every local script and
# stylesheet it references (`build = "static"` means the checkout runs as-is, no build step).
# `title` comes from the README heading, `description` from the README / GitHub repository description (markdown
# link syntax removed). Categories are chosen by hand (research §6.1: "js13k / Y8 / OSS: chosen by hand").
#
# Entries with `enabled = false` cannot be self-hosted from a plain checkout (build step, server component,
# analytics, third-party loads, a failed review, or not a finished game); `notes` says why. Every enabled entry
# carries `reviewed`: the review of its pinned commit (docs/WAVE-C.md D5, §4.8 item 5); without one an entry is never
# fetched or served. `isolated = true`: the review found no storage use, so the game runs in an opaque-origin sandbox.
# The importer only lists enabled entries whose build exists
# under $GNOME_OSS_GAMES_DIR/<slug>/<entry> (see README), and serves them from the proxy origin at
# /oss/<slug>/<entry>. Show the licence, copyright line and repository link next to the game; ship the LICENSE
# file with the build; for (A)GPL games also publish any modified source.

