[package]
name = "gnome-catalog"
description = "GNOME game catalog: schema, legitimate-source importers, search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Plain versioned dependencies (the same versions the workspace pins), so the root Cargo.toml stays untouched.
[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
quick-xml = { version = "0.42.0", default-features = false }
# `bundled` compiles SQLite with FTS5 + JSON1; same features as the workspace entry.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["time"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
