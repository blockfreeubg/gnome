# TEST-ONLY overlay for the e2e harness. NEVER use in a deployment.
#
# Loaded AFTER services/holywisp/gnome.conf (`--config gnome.conf --config holywisp-test-only.conf`), so every
# other key keeps its production value. It lets the second HolyWisp instance reach this host's loopback, where
# the harness' local test site (tests/e2e/spike-engine-host/servers/target.mjs, 127.0.0.1:22090) runs. The
# gateway stub routes only /wisp/p/test-loopback/ to this instance; /wisp/ goes to the unmodified gnome.conf.
allow-loopback = on
log-level = info                 # evidence for the harness log; gnome.conf keeps warn
