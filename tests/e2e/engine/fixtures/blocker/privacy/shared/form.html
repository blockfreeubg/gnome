<head><meta charset="utf-8"><title>form and frame</title></head>
<body>

  <button id="go" type="submit">send</button>
</form>
<iframe id="frame" src="{{origin:site-b}}/echo?format=html&amp;utm_source=frame&amp;fbclid=f8&amp;id=8"></iframe>
</body>
</html>
